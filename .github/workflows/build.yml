name: Build PhoneMonitor (Windows VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target PhoneMonitor_VST3

      - name: Collect VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/PhoneMonitor_artefacts/Release/VST3/PhoneMonitor.vst3" "dist/PhoneMonitor.vst3"
          Compress-Archive -Path "dist/PhoneMonitor.vst3" -DestinationPath "PhoneMonitor-VST3.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMonitor-VST3
          path: dist

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhoneMonitor-VST3.zip
